[package]
name = "user-service"
version = "0.1.0"
edition = "2024"
description = "open-travel user service (profile / register)"

[dependencies]
shared = { path = "../shared" }
# e-cat 聚合 crate 只取核心（App 生命周期），不启用 grpc 以缩小依赖树
ecat = { path = "../../e-cat/ecat", default-features = false }
ecat-transport-http = { path = "../../e-cat/ecat-transport-http" }
ecat-auth = { path = "../../e-cat/ecat-auth" }
ecat-middleware = { path = "../../e-cat/ecat-middleware" }
ecat-security = { path = "../../e-cat/ecat-security" }
ecat-circuit-breaker = { path = "../../e-cat/ecat-circuit-breaker" }
ecat-tracing = { path = "../../e-cat/ecat-tracing" }
ecat-data = { path = "../../e-cat/ecat-data" }
ecat-data-sqlx = { path = "../../e-cat/ecat-data-sqlx" }
ecat-data-redis = { path = "../../e-cat/ecat-data-redis" }
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
