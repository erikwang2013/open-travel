<?xml version="1.0" encoding="UTF-8"?>
<!-- Nannan 南南 — Open Travel 吉祥物（图标版）
     与 docs/mascot.svg 同一造型源：罗盘精灵的表盘特写。
     本文件为 16~32px favicon 优化版：只保留小尺寸下仍可辨认的元素
     （表圈 / 12 刻度 / 表情 / 指针），去掉手臂、放大镜、脚、航线等细碎笔画，
     避免糊成一团。完整全身像见 docs/mascot.svg。
     扁平几何、无 <defs>/渐变，移动端 SVG 渲染器可直接渲染。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Nannan 南南 — Open Travel</title>
  <desc id="desc">圆表盘造型的罗盘精灵头像：蓝色表圈上十二个刻度，浅色面盘上有笑脸，头顶立着一根珊瑚色指针。</desc>

  <!-- 表壳 -->
  <circle cx="64" cy="70" r="50" fill="#2F6FED"/>

  <!-- 12 刻度 = 12+ 语种（短而细，避免整圈读成救生圈） -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.9">
    <line x1="64.0" y1="27.0" x2="64.0" y2="21.0" stroke-width="6"/>
    <line x1="84.5" y1="32.5" x2="87.5" y2="27.3" stroke-width="4"/>
    <line x1="99.5" y1="47.5" x2="104.7" y2="44.5" stroke-width="4"/>
    <line x1="105.0" y1="70.0" x2="111.0" y2="70.0" stroke-width="6"/>
    <line x1="99.5" y1="92.5" x2="104.7" y2="95.5" stroke-width="4"/>
    <line x1="84.5" y1="107.5" x2="87.5" y2="112.7" stroke-width="4"/>
    <line x1="64.0" y1="113.0" x2="64.0" y2="119.0" stroke-width="6"/>
    <line x1="43.5" y1="107.5" x2="40.5" y2="112.7" stroke-width="4"/>
    <line x1="28.5" y1="92.5" x2="23.3" y2="95.5" stroke-width="4"/>
    <line x1="23.0" y1="70.0" x2="17.0" y2="70.0" stroke-width="6"/>
    <line x1="28.5" y1="47.5" x2="23.3" y2="44.5" stroke-width="4"/>
    <line x1="43.5" y1="32.5" x2="40.5" y2="27.3" stroke-width="4"/>
  </g>

  <!-- 面盘 -->
  <circle cx="64" cy="70" r="39" fill="#F6FCFF" stroke="#C5E4F6" stroke-width="2"/>

  <!-- 表情（略小，给表盘留白，避免读成纯笑脸球） -->
  <ellipse cx="43" cy="80" rx="6" ry="4" fill="#FFC2CE"/>
  <ellipse cx="85" cy="80" rx="6" ry="4" fill="#FFC2CE"/>
  <circle cx="52" cy="67" r="6" fill="#1F2328"/>
  <circle cx="76" cy="67" r="6" fill="#1F2328"/>
  <circle cx="50.2" cy="65" r="2.1" fill="#FFFFFF"/>
  <circle cx="74.2" cy="65" r="2.1" fill="#FFFFFF"/>
  <path d="M57 80 Q64 87 71 80" fill="none" stroke="#1F2328" stroke-width="3" stroke-linecap="round"/>

  <!-- 指针：画在表壳之后，轴心圆盘才能露在蓝色表圈上 -->
  <!-- 描边必需：白色半边在浅色背景上无描边会看不见 -->
  <g transform="translate(64 26) rotate(14)">
    <path d="M0 -22 L10 0 L0 8 L-10 0 Z" fill="#E75A70" stroke="#C13F53"
          stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M0 -22 L10 0 L0 0 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4.2" fill="#F6FCFF" stroke="#2F6FED" stroke-width="2.4"/>
  </g>

  <!-- 水印 -->
  <text x="64" y="126" font-family="Arial, sans-serif" font-size="7" text-anchor="middle"
        fill="#7FA8C4" opacity="0.6">https://erik.xyz</text>
</svg>
