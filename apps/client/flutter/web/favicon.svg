<?xml version="1.0" encoding="UTF-8"?>
<!-- Dora 小途 — Open Travel 吉祥物（图标版）
     与 docs/mascot.svg 同一造型源：猫脸取 Twemoji 1f431 (CC-BY 4.0,
     https://github.com/jdecked/twemoji) 修改，探险帽为原创。
     本文件为 16~32px favicon 优化版：只保留脸部高辨识度元素（耳/眼/鼻/嘴/帽），
     去掉胡须、额纹、行李等细碎笔画，避免小尺寸糊成一团。
     完整全身像见 docs/mascot.svg。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Dora 小途 — Open Travel</title>
  <desc id="desc">圆形徽章内的琥珀色旅行猫头像，右耳斜扣一顶探险帽。猫脸造型基于 Twemoji (CC-BY 4.0)。</desc>

  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#F6FCFF"/>
      <stop offset="100%" stop-color="#C9E8F9"/>
    </linearGradient>
  </defs>

  <!-- 圆徽底色 -->
  <circle cx="64" cy="64" r="62" fill="url(#bgG)"/>
  <circle cx="64" cy="64" r="62" fill="none" stroke="#C5E4F6" stroke-width="2"/>

