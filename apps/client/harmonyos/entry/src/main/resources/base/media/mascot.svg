<?xml version="1.0" encoding="UTF-8"?>
<!-- Nannan 南南 — Open Travel 吉祥物（鸿蒙变体 / HarmonyOS build）
     品牌与造型的唯一矢量源是仓库根的 docs/mascot.svg，本文件由它派生：
     为适配移动端 SVG 渲染器，把半透明色块预乘为实色、白色高光直接取实白（全文件不含 opacity），
     几何、配色与描边完全一致。改造型请改 docs/mascot.svg 后重新派生本文件。
     作者 https://erik.xyz -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nannan 南南 — Open Travel 吉祥物</title>
  <desc id="desc">圆表盘造型的罗盘精灵：蓝色表圈上十二个刻度代表十二语种，头顶一根珊瑚色指针，右手持放大镜。</desc>

  <!-- ============ 地面阴影 ============ -->
  <ellipse cx="256" cy="472" rx="120" ry="13" fill="#D2E4F1"/>

  <!-- ============ 航线点缀（左上方）：虚线弧 + 小飞机 ============ -->
  <path d="M28 210 Q34 128 96 108" fill="none" stroke="#7FB3D6" stroke-width="4"
        stroke-dasharray="0.1 14" stroke-linecap="round"/>
  <g transform="translate(94 98) rotate(22)">
    <path d="M0 0 L50 16 L10 25 L16 16 Z" fill="#7FB3D6"/>
    <path d="M0 0 L50 16 L16 16 Z" fill="#A9D2EA"/>
  </g>
  <path d="M34 300 L36 306 L42 308 L36 310 L34 316 L32 310 L26 308 L32 306 Z" fill="#FFC987"/>
  <path d="M470 250 L472 256 L478 258 L472 260 L470 266 L468 260 L462 258 L468 256 Z" fill="#FFC987"/>

  <!-- ============ 脚 ============ -->
  <ellipse cx="212" cy="440" rx="38" ry="24" fill="#2F6FED"/>
  <ellipse cx="300" cy="440" rx="38" ry="24" fill="#2F6FED"/>

  <!-- ============ 左臂 ============ -->
  <path d="M120 352 Q78 376 72 404" fill="none" stroke="#2F6FED" stroke-width="30" stroke-linecap="round"/>
  <circle cx="72" cy="404" r="21" fill="#2F6FED"/>

  <!-- ============ 右臂 + 放大镜（搜索） ============ -->
  <path d="M392 366 Q412 374 428 380" fill="none" stroke="#2F6FED" stroke-width="30" stroke-linecap="round"/>
  <path d="M479 431 L498 450" stroke="#F18F26" stroke-width="20" stroke-linecap="round"/>
  <circle cx="452" cy="404" r="38" fill="#D8EEFB" stroke="#F18F26" stroke-width="17"/>
  <path d="M433 385 Q440 378 451 377" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

  <!-- ============ 表壳 ============ -->
  <circle cx="256" cy="262" r="172" fill="#2F6FED"/>

  <!-- 12 刻度 = 12+ 语种 -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="256.0" y1="112.0" x2="256.0" y2="95.0" stroke-width="11"/>
    <line x1="331.0" y1="132.1" x2="339.5" y2="117.4" stroke-width="6"/>
    <line x1="385.9" y1="187.0" x2="400.6" y2="178.5" stroke-width="6"/>
    <line x1="406.0" y1="262.0" x2="423.0" y2="262.0" stroke-width="11"/>
    <line x1="385.9" y1="337.0" x2="400.6" y2="345.5" stroke-width="6"/>
    <line x1="331.0" y1="391.9" x2="339.5" y2="406.6" stroke-width="6"/>
    <line x1="256.0" y1="412.0" x2="256.0" y2="429.0" stroke-width="11"/>
    <line x1="181.0" y1="391.9" x2="172.5" y2="406.6" stroke-width="6"/>
    <line x1="126.1" y1="337.0" x2="111.4" y2="345.5" stroke-width="6"/>
    <line x1="106.0" y1="262.0" x2="89.0" y2="262.0" stroke-width="11"/>
    <line x1="126.1" y1="187.0" x2="111.4" y2="178.5" stroke-width="6"/>
    <line x1="181.0" y1="132.1" x2="172.5" y2="117.4" stroke-width="6"/>
  </g>

  <!-- ============ 面盘 ============ -->
  <circle cx="256" cy="262" r="146" fill="#F6FCFF" stroke="#C5E4F6" stroke-width="5"/>

  <!-- ============ 表情 ============ -->
  <ellipse cx="192" cy="296" rx="19" ry="12" fill="#FFC2CE"/>
  <ellipse cx="320" cy="296" rx="19" ry="12" fill="#FFC2CE"/>
  <circle cx="218" cy="256" r="20" fill="#1F2328"/>
  <circle cx="294" cy="256" r="20" fill="#1F2328"/>
  <circle cx="212" cy="249" r="7" fill="#FFFFFF"/>
  <circle cx="288" cy="249" r="7" fill="#FFFFFF"/>
  <path d="M236 302 Q256 322 276 302" fill="none" stroke="#1F2328" stroke-width="9" stroke-linecap="round"/>

  <!-- ============ 指针（呆毛）：立在表壳冠上，菱形全形可见 ============ -->
  <!-- 描边必需：白色半边在浅色背景上无描边会看不见，指针会读成断掉的三角形 -->
  <g transform="translate(256 90) rotate(16)">
    <path d="M0 -84 L25 0 L0 26 L-25 0 Z" fill="#E75A70" stroke="#C13F53"
          stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -84 L25 0 L0 0 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="11" fill="#F6FCFF" stroke="#2F6FED" stroke-width="6"/>
  </g>

  <!-- ============ 水印 ============ -->
  <text x="256" y="502" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#9FBED3">https://erik.xyz</text>
</svg>
