<?xml version="1.0" encoding="UTF-8"?>
<!-- Dora 小途 — Open Travel 吉祥物
     设定：e-cat（一只猫）框架孕育的旅行猫 —— 戴探险帽、拖着贴纸行李箱、追纸飞机。
     猫脸主体基于 Twemoji (CC-BY 4.0, https://github.com/jdecked/twemoji) 修改：
     补全身（身体/前爪/尾巴为原创），加探险帽 / 徽章底 / 旅行道具 / 水印。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dora 小途 — Open Travel 吉祥物</title>
  <desc id="desc">一只戴探险帽的琥珀色旅行猫：坐姿全身像，身旁是贴纸行李箱，仰头追着小飞机。猫脸造型基于 Twemoji (CC-BY 4.0)。</desc>

  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#F6FCFF"/>
      <stop offset="100%" stop-color="#C9E8F9"/>
    </linearGradient>
  </defs>

  <!-- 圆徽底色 -->
  <circle cx="256" cy="256" r="230" fill="url(#bgG)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#C5E4F6" stroke-width="4"/>

  <!-- 飞机尾迹（虚线弧）+ 纸飞机 -->
  <path d="M56 214 Q52 128 104 102" fill="none" stroke="#7FB3D6" stroke-width="4" stroke-dasharray="0.1 14" stroke-linecap="round"/>
  <g transform="translate(102 92) rotate(24)">
    <path d="M0 0 L54 17 L11 27 L17 17 Z" fill="#7FB3D6"/>
    <path d="M0 0 L54 17 L17 17 Z" fill="#A9D2EA"/>
  </g>

  <!-- 星光 ×2 -->
  <g fill="#FFC987">
    <path d="M92 300 L94.6 307.4 L102 310 L94.6 312.6 L92 320 L89.4 312.6 L82 310 L89.4 307.4 Z"/>
    <path d="M414 250 L416.6 257.4 L424 260 L416.6 262.6 L414 270 L411.4 262.6 L404 260 L411.4 257.4 Z"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="256" cy="462" rx="125" ry="11" fill="#7FB3D6" opacity="0.38"/>

  <!-- ============ 尾巴（身体后方右侧卷起，深橙尾尖） ============ -->
  <path d="M334 414 Q404 428 408 372 Q410 342 384 340" fill="none" stroke="#FFCC4D" stroke-width="22" stroke-linecap="round"/>
  <path d="M404 388 Q408 348 384 340" fill="none" stroke="#F18F26" stroke-width="22" stroke-linecap="round"/>

  <!-- ============ 身体（Q版坐姿，头身比约 1:0.7） ============ -->
  <path d="M256 356 C196 356 172 392 175 426 C178 448 205 456 256 456 C307 456 334 448 337 426 C340 392 316 356 256 356 Z" fill="#FFCC4D"/>
  <!-- 肚皮浅色块 -->
  <ellipse cx="256" cy="428" rx="54" ry="26" fill="#FFE3A6"/>
  <!-- 前爪 -->
  <ellipse cx="222" cy="444" rx="15" ry="9" fill="#FFDD8F"/>
  <ellipse cx="290" cy="444" rx="15" ry="9" fill="#FFDD8F"/>

