    <path d="M34 2 v-10 a10 9 0 0 1 20 0 v10" fill="none" stroke="#8A5A33" stroke-width="6" stroke-linecap="round"/>
    <rect x="0" y="0" width="88" height="72" rx="10" fill="#E89A55" stroke="#C17A3C" stroke-width="3"/>
    <rect x="20" y="0" width="9" height="72" fill="#B06A32" opacity="0.85"/>
    <rect x="59" y="0" width="9" height="72" fill="#B06A32" opacity="0.85"/>
    <!-- 贴纸 -->
    <circle cx="14" cy="20" r="8" fill="#FFFFFF" opacity="0.95"/>
