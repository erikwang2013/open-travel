  <text x="145" y="342" text-anchor="middle" class="t-eng">Order Management</text>
  <line x1="52" y1="354" x2="238" y2="354" stroke="#d0d7de" stroke-width="1"/>
  <text x="145" y="378" text-anchor="middle" class="t-s">استعلام الطلب · تتبع الحالة</text>
  <text x="145" y="400" text-anchor="middle" class="t-s">تعديل / إلغاء · إشعارات</text>

  <rect x="265" y="280" width="210" height="150" class="card"/>
  <rect x="265" y="280" width="210" height="4" class="accent"/>
  <text x="370" y="322" text-anchor="middle" class="t-m">نظام التقييم</text>
  <text x="370" y="342" text-anchor="middle" class="t-eng">Review System</text>
  <line x1="277" y1="354" x2="463" y2="354" stroke="#d0d7de" stroke-width="1"/>
  <text x="370" y="378" text-anchor="middle" class="t-s">تعليقات · تقييم · مراجعة</text>
  <text x="370" y="400" text-anchor="middle" class="t-s">تصفية محتوى · ترتيب</text>

  <rect x="490" y="280" width="210" height="150" class="card"/>
  <rect x="490" y="280" width="210" height="4" class="accent"/>
  <text x="595" y="322" text-anchor="middle" class="t-m">حزمة لغات i18n ARB</text>
  <text x="595" y="342" text-anchor="middle" class="t-eng">i18n ARB Locale</text>
  <line x1="502" y1="354" x2="688" y2="354" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="378" text-anchor="middle" class="t-s">موارد 12+ لغة</text>
  <text x="595" y="400" text-anchor="middle" class="t-s">صيغة ARB · تحميل ديناميكي</text>

  <rect x="715" y="280" width="210" height="150" class="card"/>
  <rect x="715" y="280" width="210" height="4" class="accent"/>
  <text x="820" y="322" text-anchor="middle" class="t-m">إشعارات Kafka</text>
  <text x="820" y="342" text-anchor="middle" class="t-eng">Kafka Notifications</text>
  <line x1="727" y1="354" x2="913" y2="354" stroke="#d0d7de" stroke-width="1"/>
  <text x="820" y="378" text-anchor="middle" class="t-s">رسائل غير متزامنة · تسليم موثوق</text>
  <text x="820" y="400" text-anchor="middle" class="t-s">بريد · رسائل · داخلية</text>

  <!-- 底部技术栈 -->
  <rect x="40" y="470" width="920" height="80" class="panel"/>
  <text x="60" y="500" class="t-h">حزمة القدرات الأساسية</text>
  <text x="60" y="528" class="t-s">e-cat (Rust) · Flutter · HarmonyOS · MySQL · Redis · OpenSearch · Kafka · ويتشات باي · أليباي</text>

  <text x="500" y="590" text-anchor="middle" class="t-s">12+ لغة · 51 crates · تغطية متعددة (iOS / Android / Web / Desktop / HarmonyOS)</text>
  <text x="988" y="628" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
