  <rect x="40" y="470" width="920" height="80" class="panel"/>
  <text x="60" y="500" class="t-h">Базовый стек</text>
  <text x="60" y="528" class="t-s">e-cat (Rust) · Flutter · HarmonyOS · MySQL · Redis · OpenSearch · Kafka · WeChat Pay · Alipay · Consul</text>

  <text x="500" y="590" text-anchor="middle" class="t-s">12+ языков · 51 крейт · платформы (iOS / Android / Web / Desktop / HarmonyOS)</text>
  <text x="988" y="628" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
