  <rect x="396" y="372" width="168" height="64" class="box"/>
  <text x="480" y="396" text-anchor="middle" class="t-m">Booking — бронирование</text>
  <text x="480" y="418" text-anchor="middle" class="t-s">Популярные направления · достопримечательности</text>
  <rect x="576" y="372" width="168" height="64" class="box"/>
  <text x="660" y="396" text-anchor="middle" class="t-m">Admin админ</text>
  <text x="660" y="418" text-anchor="middle" class="t-s">Вход админа · CRUD контента</text>
  <rect x="216" y="448" width="168" height="64" class="box"/>
  <text x="300" y="472" text-anchor="middle" class="t-m">Flight — авиабилеты</text>
  <text x="300" y="494" text-anchor="middle" class="t-s">Поиск рейсов · бронирование</text>
  <rect x="396" y="448" width="168" height="64" class="box"/>
  <text x="480" y="472" text-anchor="middle" class="t-m">Hotel — отели</text>
  <text x="480" y="494" text-anchor="middle" class="t-s">Поиск отелей · бронирование</text>
  <rect x="576" y="448" width="168" height="64" class="box"/>
  <text x="660" y="472" text-anchor="middle" class="t-m">Payment — оплата</text>
  <text x="660" y="494" text-anchor="middle" class="t-s">Каналы оплаты · колбэки</text>

  <!-- 数据层 -->
  <rect x="30" y="544" width="720" height="96" class="panel"/>
  <text x="48" y="574" class="t-h">Слой данных</text>
  <text x="48" y="594" class="t-s">Data Layer</text>
  <rect x="216" y="564" width="168" height="56" class="box"/>
  <text x="300" y="588" text-anchor="middle" class="t-m">MySQL</text>
  <text x="300" y="608" text-anchor="middle" class="t-s">БД travel · таблицы travel_*</text>
  <rect x="396" y="564" width="168" height="56" class="box"/>
  <text x="480" y="588" text-anchor="middle" class="t-m">Redis</text>
  <text x="480" y="608" text-anchor="middle" class="t-s">Кэш · сессии</text>
  <rect x="576" y="564" width="168" height="56" class="box"/>
  <text x="660" y="588" text-anchor="middle" class="t-m">OpenSearch</text>
  <text x="660" y="608" text-anchor="middle" class="t-s">Поиск · агрегация</text>
  <rect x="216" y="564" width="126" height="56" class="box"/>
  <text x="279" y="588" text-anchor="middle" class="t-m">MySQL</text>
  <text x="279" y="608" text-anchor="middle" class="t-s">Мастер-реплика</text>
  <rect x="350" y="564" width="126" height="56" class="box"/>
  <text x="413" y="588" text-anchor="middle" class="t-m">Redis</text>
  <text x="413" y="608" text-anchor="middle" class="t-s">Кэш · сессии</text>
  <rect x="484" y="564" width="126" height="56" class="box"/>
  <text x="547" y="588" text-anchor="middle" class="t-m">Kafka</text>
  <text x="547" y="608" text-anchor="middle" class="t-s">Журналы аудита</text>
  <rect x="618" y="564" width="126" height="56" class="box"/>
  <text x="681" y="588" text-anchor="middle" class="t-m">OpenSearch</text>
  <text x="681" y="608" text-anchor="middle" class="t-s">Поиск · агрегация</text>
  <rect x="786" y="290" width="168" height="130" class="box"/>
  <text x="870" y="322" text-anchor="middle" class="t-m">Auth / JWT</text>
  <text x="870" y="346" text-anchor="middle" class="t-s">OAuth2 · проверка токена</text>
  <text x="870" y="368" text-anchor="middle" class="t-s">Роли и права · RBAC</text>
  <rect x="786" y="440" width="168" height="130" class="box"/>
  <text x="870" y="472" text-anchor="middle" class="t-m">TLS — шифрование</text>
  <text x="870" y="496" text-anchor="middle" class="t-s">TLS 1.3 · сертификаты</text>
  <text x="870" y="518" text-anchor="middle" class="t-s">Взаимный mTLS</text>

  <!-- 箭头 -->
  <line x1="390" y1="179" x2="390" y2="189" class="arrow"/>
  <line x1="390" y1="291" x2="390" y2="301" class="arrow"/>
  <line x1="390" y1="528" x2="390" y2="540" class="arrow"/>
  <line x1="748" y1="240" x2="768" y2="240" class="arrow"/>
  <line x1="748" y1="452" x2="768" y2="452" class="arrow"/>

  <text x="500" y="664" text-anchor="middle" class="t-s">MySQL: БД travel, все таблицы с префиксом travel_ (travel_users · travel_orders)</text>
  <text x="988" y="668" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
