  <text x="480" y="256" text-anchor="middle" class="t-s">TLS · лимиты · маршрутизация · аутентификация</text>

  <!-- e-cat 核心服务层 -->
  <rect x="30" y="304" width="720" height="224" class="panel"/>
  <text x="48" y="334" class="t-h">Слой ядра e-cat</text>
  <text x="48" y="354" class="t-s">e-cat Core Services · Rust-микросервисы</text>
  <rect x="216" y="372" width="168" height="64" class="box"/>
  <text x="300" y="396" text-anchor="middle" class="t-m">User — пользователи</text>
