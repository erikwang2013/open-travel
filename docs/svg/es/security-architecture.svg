<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .t-title { font-size: 20px; font-weight: 700; fill: #1f2328; }
      .t-sub  { font-size: 12px; fill: #6e7781; }
      .t-h    { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .t-eng  { font-size: 11px; fill: #6e7781; }
      .t-kw   { font-size: 17px; font-weight: 700; fill: #2f6fed; }
      .t-s    { font-size: 12px; fill: #6e7781; }
      .panel  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
      .line   { stroke: #d0d7de; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" class="t-title">Arquitectura de Seguridad</text>
  <text x="500" y="56" text-anchor="middle" class="t-sub">Open-Travel Security Architecture · Defensa en profundidad</text>

  <!-- 第一行 -->
  <rect x="40" y="100" width="300" height="210" class="panel"/>
  <circle cx="60" cy="132" r="5" fill="#2f6fed"/>
  <text x="74" y="137" class="t-h">Cifrado de Transporte</text>
  <text x="56" y="158" class="t-eng">Transport Security</text>
  <line x1="56" y1="170" x2="324" y2="170" class="line"/>
  <text x="190" y="200" text-anchor="middle" class="t-kw">TLS 1.3</text>
  <text x="190" y="232" text-anchor="middle" class="t-s">Nginx termina TLS · Cifrado integral</text>
  <text x="190" y="254" text-anchor="middle" class="t-s">Verificación ApiVersion · X-Api-Version: v1</text>

  <rect x="350" y="100" width="300" height="210" class="panel"/>
  <circle cx="370" cy="132" r="5" fill="#00b894"/>
  <text x="384" y="137" class="t-h">Autenticación y Autorización</text>
  <text x="366" y="158" class="t-eng">Authentication &amp; Authorization</text>
  <line x1="366" y1="170" x2="634" y2="170" class="line"/>
  <text x="500" y="200" text-anchor="middle" class="t-kw">JWT · HS256</text>
  <text x="500" y="232" text-anchor="middle" class="t-s">claims.sub = user_id · JWT_SECRET ≥ 32 B</text>
  <text x="500" y="254" text-anchor="middle" class="t-s">JWT admin separado · Usuario deshabilitado (status=1) → 403</text>

  <rect x="660" y="100" width="300" height="210" class="panel"/>
  <circle cx="680" cy="132" r="5" fill="#ff9f43"/>
  <text x="694" y="137" class="t-h">Límites y Anti-Abuso</text>
  <text x="676" y="158" class="t-eng">Rate Limiting</text>
  <line x1="676" y1="170" x2="944" y2="170" class="line"/>
  <text x="810" y="200" text-anchor="middle" class="t-kw">Ventana fija Redis distribuida</text>
  <text x="810" y="232" text-anchor="middle" class="t-s">100 req / 60 s por servicio</text>
  <text x="810" y="254" text-anchor="middle" class="t-s">Exceso 429 · Anti-abuso / DDoS</text>

  <!-- 第二行 -->
  <rect x="40" y="330" width="300" height="210" class="panel"/>
  <circle cx="60" cy="362" r="5" fill="#2f6fed"/>
  <text x="74" y="367" class="t-h">Filtrado de Entradas</text>
  <text x="56" y="388" class="t-eng">Input Filtering</text>
  <line x1="56" y1="400" x2="324" y2="400" class="line"/>
  <text x="190" y="430" text-anchor="middle" class="t-kw">Escáner security-rust</text>
  <text x="190" y="462" text-anchor="middle" class="t-s">Detección XSS / inyección SQL · header + body</text>
  <text x="190" y="484" text-anchor="middle" class="t-s">Lista blanca · SQL precompilado</text>

  <rect x="350" y="330" width="300" height="210" class="panel"/>
  <circle cx="370" cy="362" r="5" fill="#00b894"/>
  <text x="384" y="367" class="t-h">Registros de Auditoría</text>
  <text x="366" y="388" class="t-eng">Audit Logs</text>
  <line x1="366" y1="400" x2="634" y2="400" class="line"/>
  <text x="500" y="430" text-anchor="middle" class="t-kw">Kafka → travel-audit</text>
  <text x="500" y="462" text-anchor="middle" class="t-s">user.register · user.login · admin.login</text>
  <text x="500" y="484" text-anchor="middle" class="t-s">order.created · order.paid · order.cancelled</text>

  <rect x="660" y="330" width="300" height="210" class="panel"/>
  <circle cx="680" cy="362" r="5" fill="#ff9f43"/>
  <text x="694" y="367" class="t-h">Seguridad de Pagos</text>
  <text x="676" y="388" class="t-eng">Payment Security</text>
  <line x1="676" y1="400" x2="944" y2="400" class="line"/>
  <text x="810" y="430" text-anchor="middle" class="t-kw">Verificación HMAC-SHA256</text>
  <text x="810" y="462" text-anchor="middle" class="t-s">Verificar X-Signature callback · inválido → 401</text>
  <text x="810" y="484" text-anchor="middle" class="t-s">Idempotencia txn_no · interno X-Internal-Token</text>
  <text x="810" y="506" text-anchor="middle" class="t-s">Canal por idioma · stripe/wechat/alipay…</text>

  <!-- 中间件链 -->
  <text x="500" y="556" text-anchor="middle" class="t-s">Cadena de middleware: Tracing → CircuitBreaker → Security → RateLimit(Redis) → JWT · ApiVersion en capa externa</text>

  <!-- 密码哈希 -->
  <rect x="40" y="560" width="920" height="80" class="panel"/>
  <circle cx="60" cy="592" r="5" fill="#2f6fed"/>
  <text x="74" y="597" class="t-h">Hash de Contraseñas bcrypt</text>
  <text x="56" y="622" class="t-s">Módulo ecat-security · Hash con sal · Irreversible · Anti-tablas arcoíris</text>

  <text x="500" y="662" text-anchor="middle" class="t-sub">Defensa en profundidad Defense in Depth · Refuerzo de seguridad integral</text>
  <text x="988" y="668" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
