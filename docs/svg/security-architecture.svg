<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .t-title { font-size: 20px; font-weight: 700; fill: #1f2328; }
      .t-sub  { font-size: 12px; fill: #6e7781; }
      .t-h    { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .t-eng  { font-size: 11px; fill: #6e7781; }
      .t-kw   { font-size: 17px; font-weight: 700; fill: #2f6fed; }
      .t-s    { font-size: 12px; fill: #6e7781; }
      .panel  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
      .line   { stroke: #d0d7de; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" class="t-title">安全架构</text>
  <text x="500" y="56" text-anchor="middle" class="t-sub">Open-Travel Security Architecture · 纵深防御</text>

  <!-- 第一行 -->
  <rect x="40" y="100" width="300" height="210" class="panel"/>
  <circle cx="60" cy="132" r="5" fill="#2f6fed"/>
  <text x="74" y="137" class="t-h">传输加密</text>
  <text x="56" y="158" class="t-eng">Transport Security</text>
  <line x1="56" y1="170" x2="324" y2="170" class="line"/>
  <text x="190" y="200" text-anchor="middle" class="t-kw">TLS 1.3</text>
  <text x="190" y="232" text-anchor="middle" class="t-s">Nginx 终止 TLS · 全链路加密</text>
  <text x="190" y="254" text-anchor="middle" class="t-s">ApiVersion 校验 · X-Api-Version: v1</text>

  <rect x="350" y="100" width="300" height="210" class="panel"/>
  <circle cx="370" cy="132" r="5" fill="#00b894"/>
  <text x="384" y="137" class="t-h">认证授权</text>
  <text x="366" y="158" class="t-eng">Authentication &amp; Authorization</text>
  <line x1="366" y1="170" x2="634" y2="170" class="line"/>
  <text x="500" y="200" text-anchor="middle" class="t-kw">JWT · HS256</text>
  <text x="500" y="232" text-anchor="middle" class="t-s">claims.sub = user_id · JWT_SECRET ≥ 32B</text>
  <text x="500" y="254" text-anchor="middle" class="t-s">管理端独立 JWT · 用户禁用(status=1) → 403</text>

  <rect x="660" y="100" width="300" height="210" class="panel"/>
  <circle cx="680" cy="132" r="5" fill="#ff9f43"/>
  <text x="694" y="137" class="t-h">限流防刷</text>
  <text x="676" y="158" class="t-eng">Rate Limiting</text>
  <line x1="676" y1="170" x2="944" y2="170" class="line"/>
  <text x="810" y="200" text-anchor="middle" class="t-kw">Redis 分布式固定窗口</text>
  <text x="810" y="232" text-anchor="middle" class="t-s">100 req / 60s · 每服务</text>
  <text x="810" y="254" text-anchor="middle" class="t-s">超限 429 · 防刷 · 防 DDoS</text>

  <!-- 第二行 -->
  <rect x="40" y="330" width="300" height="210" class="panel"/>
  <circle cx="60" cy="362" r="5" fill="#2f6fed"/>
  <text x="74" y="367" class="t-h">输入过滤</text>
  <text x="56" y="388" class="t-eng">Input Filtering</text>
  <line x1="56" y1="400" x2="324" y2="400" class="line"/>
  <text x="190" y="430" text-anchor="middle" class="t-kw">security-rust 扫描器</text>
  <text x="190" y="462" text-anchor="middle" class="t-s">XSS / SQL 注入检测 · header + body</text>
  <text x="190" y="484" text-anchor="middle" class="t-s">参数白名单 · SQL 预编译</text>

  <rect x="350" y="330" width="300" height="210" class="panel"/>
  <circle cx="370" cy="362" r="5" fill="#00b894"/>
  <text x="384" y="367" class="t-h">审计日志</text>
  <text x="366" y="388" class="t-eng">Audit Logs</text>
  <line x1="366" y1="400" x2="634" y2="400" class="line"/>
  <text x="500" y="430" text-anchor="middle" class="t-kw">Kafka → travel-audit</text>
  <text x="500" y="462" text-anchor="middle" class="t-s">user.register · user.login · admin.login</text>
  <text x="500" y="484" text-anchor="middle" class="t-s">order.created · order.paid · order.cancelled</text>

  <rect x="660" y="330" width="300" height="210" class="panel"/>
  <circle cx="680" cy="362" r="5" fill="#ff9f43"/>
  <text x="694" y="367" class="t-h">支付安全</text>
  <text x="676" y="388" class="t-eng">Payment Security</text>
  <line x1="676" y1="400" x2="944" y2="400" class="line"/>
  <text x="810" y="430" text-anchor="middle" class="t-kw">HMAC-SHA256 验签</text>
  <text x="810" y="462" text-anchor="middle" class="t-s">回调 X-Signature 验签 · 非法 401</text>
  <text x="810" y="484" text-anchor="middle" class="t-s">txn_no 幂等 · 内部 X-Internal-Token</text>
  <text x="810" y="506" text-anchor="middle" class="t-s">渠道按语言路由 · stripe/wechat/alipay…</text>

  <!-- 中间件链 -->
  <text x="500" y="556" text-anchor="middle" class="t-s">中间件链: Tracing → CircuitBreaker → Security → RateLimit(Redis) → JWT · 最外层 ApiVersion 校验</text>

  <!-- 密码哈希 -->
  <rect x="40" y="560" width="920" height="80" class="panel"/>
  <circle cx="60" cy="592" r="5" fill="#2f6fed"/>
  <text x="74" y="597" class="t-h">密码哈希 bcrypt</text>
  <text x="56" y="622" class="t-s">ecat-security 模块 · 加盐哈希 · 不可逆存储 · 防彩虹表攻击</text>

  <text x="500" y="662" text-anchor="middle" class="t-sub">纵深防御 Defense in Depth · 全链路安全加固</text>
  <text x="988" y="668" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
