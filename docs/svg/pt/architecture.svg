  <rect x="786" y="440" width="168" height="130" class="box"/>
  <text x="870" y="472" text-anchor="middle" class="t-m">Cifragem de transporte TLS</text>
  <text x="870" y="496" text-anchor="middle" class="t-s">TLS 1.3 · Certificados</text>
  <text x="870" y="518" text-anchor="middle" class="t-s">Autenticação mútua mTLS</text>

