<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .t-title { font-size: 20px; font-weight: 700; fill: #1f2328; }
      .t-sub  { font-size: 12px; fill: #6e7781; }
      .t-h    { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .t-h2   { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .t-m    { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .t-s    { font-size: 12px; fill: #6e7781; }
      .panel  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
      .box    { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
      .arrow  { stroke: #8b949e; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" class="t-title">全球旅游平台架构</text>
  <text x="500" y="56" text-anchor="middle" class="t-sub">Open-Travel Global Platform Architecture</text>

  <!-- 客户端层 -->
  <rect x="30" y="80" width="720" height="96" class="panel"/>
  <text x="48" y="110" class="t-h">客户端层</text>
  <text x="48" y="130" class="t-s">Client Layer</text>
  <rect x="216" y="100" width="168" height="56" class="box"/>
  <text x="300" y="124" text-anchor="middle" class="t-m">Flutter iOS / Android</text>
  <text x="300" y="144" text-anchor="middle" class="t-s">移动客户端 App</text>
  <rect x="396" y="100" width="168" height="56" class="box"/>
  <text x="480" y="124" text-anchor="middle" class="t-m">Flutter Web / Desktop</text>
  <text x="480" y="144" text-anchor="middle" class="t-s">网页 · 桌面客户端</text>
  <rect x="576" y="100" width="168" height="56" class="box"/>
  <text x="660" y="124" text-anchor="middle" class="t-m">HarmonyOS 鸿蒙</text>
  <text x="660" y="144" text-anchor="middle" class="t-s">鸿蒙客户端 HarmonyOS</text>

  <!-- API Gateway 层 -->
  <rect x="30" y="192" width="720" height="96" class="panel"/>
  <text x="48" y="222" class="t-h">API Gateway 层</text>
  <text x="48" y="242" class="t-s">API Gateway</text>
  <rect x="216" y="212" width="528" height="56" class="box"/>
  <text x="480" y="236" text-anchor="middle" class="t-m">Nginx 网关</text>
  <text x="480" y="256" text-anchor="middle" class="t-s">TLS 加密 · 限流防刷 · 路由转发 · 认证鉴权</text>

  <!-- e-cat 核心服务层 -->
  <rect x="30" y="304" width="720" height="168" class="panel"/>
  <text x="48" y="334" class="t-h">e-cat 核心服务层</text>
  <text x="48" y="354" class="t-s">e-cat Core Services · Rust 微服务</text>
  <rect x="216" y="372" width="168" height="64" class="box"/>
  <text x="300" y="396" text-anchor="middle" class="t-m">User 用户</text>
  <text x="300" y="418" text-anchor="middle" class="t-s">注册登录 · 个人资料</text>
  <rect x="396" y="372" width="168" height="64" class="box"/>
  <text x="480" y="396" text-anchor="middle" class="t-m">Booking 预订</text>
  <text x="480" y="418" text-anchor="middle" class="t-s">热门目的地 · 景区</text>
  <rect x="576" y="372" width="168" height="64" class="box"/>
  <text x="660" y="396" text-anchor="middle" class="t-m">Admin 管理</text>
  <text x="660" y="418" text-anchor="middle" class="t-s">管理登录 · 内容 CRUD</text>

  <!-- 数据层 -->
  <rect x="30" y="544" width="720" height="96" class="panel"/>
  <text x="48" y="574" class="t-h">数据层</text>
  <text x="48" y="594" class="t-s">Data Layer</text>
  <rect x="216" y="564" width="168" height="56" class="box"/>
  <text x="300" y="588" text-anchor="middle" class="t-m">MySQL</text>
  <text x="300" y="608" text-anchor="middle" class="t-s">travel 库 · travel_* 表</text>
  <rect x="396" y="564" width="168" height="56" class="box"/>
  <text x="480" y="588" text-anchor="middle" class="t-m">Redis</text>
  <text x="480" y="608" text-anchor="middle" class="t-s">缓存 · 会话</text>
  <rect x="576" y="564" width="168" height="56" class="box"/>
  <text x="660" y="588" text-anchor="middle" class="t-m">OpenSearch</text>
  <text x="660" y="608" text-anchor="middle" class="t-s">多语言搜索 · 聚合</text>
  <rect x="216" y="564" width="126" height="56" class="box"/>
  <text x="279" y="588" text-anchor="middle" class="t-m">MySQL</text>
  <text x="279" y="608" text-anchor="middle" class="t-s">主从·读写分离</text>
  <rect x="350" y="564" width="126" height="56" class="box"/>
  <text x="413" y="588" text-anchor="middle" class="t-m">Redis</text>
  <text x="413" y="608" text-anchor="middle" class="t-s">缓存 · 会话</text>
  <rect x="484" y="564" width="126" height="56" class="box"/>
  <text x="547" y="588" text-anchor="middle" class="t-m">Kafka</text>
  <text x="547" y="608" text-anchor="middle" class="t-s">审计日志</text>
  <rect x="618" y="564" width="126" height="56" class="box"/>
  <text x="681" y="588" text-anchor="middle" class="t-m">OpenSearch</text>
  <text x="681" y="608" text-anchor="middle" class="t-s">多语言搜索 · 聚合</text>
  <rect x="786" y="290" width="168" height="130" class="box"/>
  <text x="870" y="322" text-anchor="middle" class="t-m">Auth / JWT 认证</text>
  <text x="870" y="346" text-anchor="middle" class="t-s">OAuth2 · Token 校验</text>
  <text x="870" y="368" text-anchor="middle" class="t-s">角色权限 RBAC</text>
  <rect x="786" y="440" width="168" height="130" class="box"/>
  <text x="870" y="472" text-anchor="middle" class="t-m">TLS 传输加密</text>
  <text x="870" y="496" text-anchor="middle" class="t-s">TLS 1.3 · 证书</text>
  <text x="870" y="518" text-anchor="middle" class="t-s">双向认证 mTLS</text>

  <!-- 箭头 -->
  <line x1="390" y1="179" x2="390" y2="189" class="arrow"/>
  <line x1="390" y1="291" x2="390" y2="301" class="arrow"/>
  <line x1="390" y1="440" x2="390" y2="540" class="arrow"/>
  <line x1="748" y1="240" x2="768" y2="240" class="arrow"/>
  <line x1="748" y1="452" x2="768" y2="452" class="arrow"/>

  <text x="500" y="664" text-anchor="middle" class="t-s">MySQL 数据库：travel 库，所有业务表以 travel_ 前缀命名（travel_users · travel_orders）</text>
  <text x="988" y="668" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
