  <text x="145" y="400" text-anchor="middle" class="t-s">Annulation · notifications</text>

  <rect x="265" y="280" width="210" height="150" class="card"/>
  <rect x="265" y="280" width="210" height="4" class="accent"/>
  <text x="370" y="322" text-anchor="middle" class="t-m">Système d'avis</text>
  <text x="370" y="342" text-anchor="middle" class="t-eng">Review System</text>
  <line x1="277" y1="354" x2="463" y2="354" stroke="#d0d7de" stroke-width="1"/>
  <text x="370" y="378" text-anchor="middle" class="t-s">Avis · notes · modération</text>
  <text x="370" y="400" text-anchor="middle" class="t-s">Filtrage · classements</text>

  <rect x="490" y="280" width="210" height="150" class="card"/>
  <rect x="490" y="280" width="210" height="4" class="accent"/>
  <text x="595" y="322" text-anchor="middle" class="t-m">Packs i18n ARB</text>
  <text x="595" y="342" text-anchor="middle" class="t-eng">i18n ARB Locale</text>
  <line x1="502" y1="354" x2="688" y2="354" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="378" text-anchor="middle" class="t-s">Ressources 12+ langues</text>
  <text x="595" y="400" text-anchor="middle" class="t-s">Format ARB · chargement dynamique</text>

  <rect x="715" y="280" width="210" height="150" class="card"/>
  <rect x="715" y="280" width="210" height="4" class="accent"/>
  <text x="820" y="322" text-anchor="middle" class="t-m">Notifications Kafka</text>
  <text x="820" y="342" text-anchor="middle" class="t-eng">Kafka Notifications</text>
  <line x1="727" y1="354" x2="913" y2="354" stroke="#d0d7de" stroke-width="1"/>
  <text x="820" y="378" text-anchor="middle" class="t-s">Messages asynchrones · fiables</text>
  <text x="820" y="400" text-anchor="middle" class="t-s">E-mail · SMS · In-App</text>

  <!-- 底部技术栈 -->
  <rect x="40" y="470" width="920" height="80" class="panel"/>
  <text x="60" y="500" class="t-h">Stack de base</text>
  <text x="60" y="528" class="t-s">e-cat (Rust) · Flutter · HarmonyOS · MySQL · Redis · OpenSearch · Kafka · WeChat Pay · Alipay · Consul</text>

  <text x="500" y="590" text-anchor="middle" class="t-s">12+ langues · 51 crates · plateformes (iOS / Android / Web / Desktop / HarmonyOS)</text>
  <text x="988" y="628" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
