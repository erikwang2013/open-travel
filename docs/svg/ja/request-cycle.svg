<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .t-title { font-size: 20px; font-weight: 700; fill: #1f2328; }
      .t-sub  { font-size: 12px; fill: #6e7781; }
      .t-m    { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .t-s    { font-size: 12px; fill: #6e7781; }
      .box    { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
      .accent { fill: #2f6fed; }
      .num    { fill: #2f6fed; }
      .arrow  { stroke: #8b949e; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" class="t-title">リクエスト処理サイクル</text>
  <text x="500" y="56" text-anchor="middle" class="t-sub">Open-Travel Request Cycle・クライアント → ゲートウェイ → サービス → データ</text>

  <!-- 步骤 1-9 -->
  <rect x="170" y="86" width="790" height="64" class="box"/>
  <rect x="170" y="86" width="4" height="64" class="accent"/>
  <text x="200" y="112" class="t-m">クライアントリクエスト</text>
  <text x="200" y="134" class="t-s">Flutter / HarmonyOS クライアントが HTTP リクエストを送信</text>
  <circle cx="90" cy="118" r="16" class="num"/>
  <text x="90" y="123" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>

  <line x1="90" y1="136" x2="90" y2="172" class="arrow"/>

  <rect x="170" y="156" width="790" height="64" class="box"/>
  <rect x="170" y="156" width="4" height="64" class="accent"/>
  <text x="200" y="182" class="t-m">Nginx API ゲートウェイ</text>
  <text x="200" y="204" class="t-s">TLS 復号・レート制限・ルーティング</text>
  <circle cx="90" cy="188" r="16" class="num"/>
  <text x="90" y="193" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>

  <line x1="90" y1="206" x2="90" y2="242" class="arrow"/>

  <rect x="170" y="226" width="790" height="64" class="box"/>
  <rect x="170" y="226" width="4" height="64" class="accent"/>
  <text x="200" y="252" class="t-m">e-cat サービス処理</text>
  <text x="200" y="274" class="t-s">Rust マイクロサービス・パラメータ検証・ビジネスロジック</text>
  <circle cx="90" cy="258" r="16" class="num"/>
  <text x="90" y="263" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>

  <line x1="90" y1="276" x2="90" y2="312" class="arrow"/>

  <rect x="170" y="296" width="790" height="64" class="box"/>
  <rect x="170" y="296" width="4" height="64" class="accent"/>
  <text x="200" y="322" class="t-m">セキュリティ層認証</text>
  <text x="200" y="344" class="t-s">JWT 検証・OAuth2・監査ログ</text>
  <circle cx="90" cy="328" r="16" class="num"/>
  <text x="90" y="333" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>

  <line x1="90" y1="346" x2="90" y2="382" class="arrow"/>

  <rect x="170" y="366" width="790" height="64" class="box"/>
  <rect x="170" y="366" width="4" height="64" class="accent"/>
  <text x="200" y="392" class="t-m">Redis キャッシュ</text>
  <text x="200" y="414" class="t-s">キャッシュヒット → 直接返却・ミス → MySQL 照会</text>
  <circle cx="90" cy="398" r="16" class="num"/>
  <text x="90" y="403" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">5</text>

  <line x1="90" y1="416" x2="90" y2="452" class="arrow"/>

  <rect x="170" y="436" width="790" height="64" class="box"/>
  <rect x="170" y="436" width="4" height="64" class="accent"/>
  <text x="200" y="462" class="t-m">MySQL 照会 / 書き込み</text>
  <text x="200" y="484" class="t-s">travel データベース・travel_* プレフィックス表（travel_users · travel_orders）</text>
  <circle cx="90" cy="468" r="16" class="num"/>
  <text x="90" y="473" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">6</text>

  <line x1="90" y1="486" x2="90" y2="522" class="arrow"/>

  <rect x="170" y="506" width="790" height="64" class="box"/>
  <rect x="170" y="506" width="4" height="64" class="accent"/>
  <text x="200" y="532" class="t-m">OpenSearch 検索</text>
  <text x="200" y="554" class="t-s">多言語トークン化・検索集計ソート</text>
  <circle cx="90" cy="538" r="16" class="num"/>
  <text x="90" y="543" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">7</text>

  <line x1="90" y1="556" x2="90" y2="592" class="arrow"/>

  <rect x="170" y="576" width="790" height="64" class="box"/>
  <rect x="170" y="576" width="4" height="64" class="accent"/>
  <text x="200" y="602" class="t-m">多言語ローカライズ</text>
  <text x="200" y="624" class="t-s">i18n ARB 言語パック・12+ 言語を動的ロード</text>
  <circle cx="90" cy="608" r="16" class="num"/>
  <text x="90" y="613" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">8</text>

  <line x1="90" y1="626" x2="90" y2="662" class="arrow"/>

  <rect x="170" y="646" width="790" height="64" class="box"/>
  <rect x="170" y="646" width="4" height="64" class="accent"/>
  <text x="200" y="672" class="t-m">クライアント応答</text>
  <text x="200" y="694" class="t-s">JSON を組み立て・クライアントへ返却</text>
  <circle cx="90" cy="678" r="16" class="num"/>
  <text x="90" y="683" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">9</text>

  <text x="500" y="738" text-anchor="middle" class="t-sub">リクエスト処理シーケンス・Request Processing Sequence</text>
  <text x="988" y="748" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
