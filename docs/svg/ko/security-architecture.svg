<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .t-title { font-size: 20px; font-weight: 700; fill: #1f2328; }
      .t-sub  { font-size: 12px; fill: #6e7781; }
      .t-h    { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .t-eng  { font-size: 11px; fill: #6e7781; }
      .t-kw   { font-size: 17px; font-weight: 700; fill: #2f6fed; }
      .t-s    { font-size: 12px; fill: #6e7781; }
      .panel  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
      .line   { stroke: #d0d7de; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" class="t-title">보안 아키텍처</text>
  <text x="500" y="56" text-anchor="middle" class="t-sub">Open-Travel Security Architecture·심층 방어</text>

  <!-- 第一行 -->
  <rect x="40" y="100" width="300" height="210" class="panel"/>
  <circle cx="60" cy="132" r="5" fill="#2f6fed"/>
  <text x="74" y="137" class="t-h">전송 암호화</text>
  <text x="56" y="158" class="t-eng">Transport Security</text>
  <line x1="56" y1="170" x2="324" y2="170" class="line"/>
  <text x="190" y="200" text-anchor="middle" class="t-kw">TLS 1.3</text>
  <text x="190" y="232" text-anchor="middle" class="t-s">Nginx TLS 종료·전 구간 암호화</text>
  <text x="190" y="254" text-anchor="middle" class="t-s">인증서 관리·다운그레이드 방지</text>

  <rect x="350" y="100" width="300" height="210" class="panel"/>
  <circle cx="370" cy="132" r="5" fill="#00b894"/>
  <text x="384" y="137" class="t-h">인증·권한 부여</text>
  <text x="366" y="158" class="t-eng">Authentication &amp; Authorization</text>
  <line x1="366" y1="170" x2="634" y2="170" class="line"/>
  <text x="500" y="200" text-anchor="middle" class="t-kw">JWT · OAuth2</text>
  <text x="500" y="232" text-anchor="middle" class="t-s">ecat-auth 모듈 발급·검증</text>
  <text x="500" y="254" text-anchor="middle" class="t-s">리프레시 토큰·역할 권한</text>

  <rect x="660" y="100" width="300" height="210" class="panel"/>
  <circle cx="680" cy="132" r="5" fill="#ff9f43"/>
  <text x="694" y="137" class="t-h">요청 제한</text>
  <text x="676" y="158" class="t-eng">Rate Limiting</text>
  <line x1="676" y1="170" x2="944" y2="170" class="line"/>
  <text x="810" y="200" text-anchor="middle" class="t-kw">Nginx + 게이트웨이 제한</text>
  <text x="810" y="232" text-anchor="middle" class="t-s">IP / 사용자 단위 제한</text>
  <text x="810" y="254" text-anchor="middle" class="t-s">남용 방지·DDoS 공격 방어</text>

  <!-- 第二行 -->
  <rect x="40" y="330" width="300" height="210" class="panel"/>
  <circle cx="60" cy="362" r="5" fill="#2f6fed"/>
  <text x="74" y="367" class="t-h">입력 필터링</text>
  <text x="56" y="388" class="t-eng">Input Filtering</text>
  <line x1="56" y1="400" x2="324" y2="400" class="line"/>
  <text x="190" y="430" text-anchor="middle" class="t-kw">XSS / SQL 인젝션 방어</text>
  <text x="190" y="462" text-anchor="middle" class="t-s">파라미터 화이트리스트 검증·이스케이프</text>
  <text x="190" y="484" text-anchor="middle" class="t-s">SQL 프리컴파일·인젝션 방지</text>

  <rect x="350" y="330" width="300" height="210" class="panel"/>
  <circle cx="370" cy="362" r="5" fill="#00b894"/>
  <text x="384" y="367" class="t-h">감사 로그</text>
  <text x="366" y="388" class="t-eng">Audit Logs</text>
  <line x1="366" y1="400" x2="634" y2="400" class="line"/>
  <text x="500" y="430" text-anchor="middle" class="t-kw">Kafka → ClickHouse</text>
  <text x="500" y="462" text-anchor="middle" class="t-s">작업 감사·전량 기록</text>
  <text x="500" y="484" text-anchor="middle" class="t-s">이상 알림·행동 추적</text>

  <rect x="660" y="330" width="300" height="210" class="panel"/>
  <circle cx="680" cy="362" r="5" fill="#ff9f43"/>
  <text x="694" y="367" class="t-h">결제 보안</text>
  <text x="676" y="388" class="t-eng">Payment Security</text>
  <line x1="676" y1="400" x2="944" y2="400" class="line"/>
  <text x="810" y="430" text-anchor="middle" class="t-kw">WeChat Pay·Alipay</text>
  <text x="810" y="462" text-anchor="middle" class="t-s">공식 SDK 서명·서명 검증</text>
  <text x="810" y="484" text-anchor="middle" class="t-s">콜백 검증·금액 일치</text>

  <!-- 密码哈希 -->
  <rect x="40" y="560" width="920" height="80" class="panel"/>
  <circle cx="60" cy="592" r="5" fill="#2f6fed"/>
  <text x="74" y="597" class="t-h">비밀번호 해시 bcrypt</text>
  <text x="56" y="622" class="t-s">ecat-security 모듈·솔트 해시·비가역 저장·레인보우 테이블 공격 방지</text>

  <text x="500" y="662" text-anchor="middle" class="t-sub">심층 방어 Defense in Depth·전 구간 보안 강화</text>
  <text x="988" y="668" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
