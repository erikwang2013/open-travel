  <circle cx="90" cy="258" r="16" class="num"/>
  <text x="90" y="263" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>

