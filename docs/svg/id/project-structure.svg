<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .t-title { font-size: 20px; font-weight: 700; fill: #1f2328; }
      .t-sub  { font-size: 12px; fill: #6e7781; }
      .t-h    { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .t-mono-root { font-family: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace; font-size: 15px; font-weight: 700; fill: #1f2328; }
      .t-mono { font-family: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #1f2328; }
      .t-mono-branch { font-family: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8b949e; }
      .t-cmt { font-family: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #6e7781; }
      .t-db  { font-family: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #1f2328; }
      .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" class="t-title">Struktur Direktori Proyek</text>
  <text x="500" y="56" text-anchor="middle" class="t-sub">Open-Travel Project Structure · Monorepo</text>

  <rect x="40" y="90" width="920" height="690" class="panel"/>
  <text x="64" y="122" class="t-h">Pohon Direktori</text>

  <!-- 根 -->
  <text x="80" y="156" class="t-mono-root">open-travel/</text>

  <!-- apps -->
  <text x="120" y="186" class="t-mono-branch">├─ </text><text x="144" y="186" class="t-mono">apps/</text>
  <text x="430" y="186" class="t-cmt"># Klien multi-platform (Flutter + HarmonyOS)</text>
  <text x="190" y="216" class="t-mono-branch">│  ├─ </text><text x="230" y="216" class="t-mono">flutter/</text>
  <text x="480" y="216" class="t-cmt"># iOS · Android · Web · Desktop</text>
  <text x="190" y="246" class="t-mono-branch">│  └─ </text><text x="230" y="246" class="t-mono">harmonyos/</text>
  <text x="480" y="246" class="t-cmt"># HarmonyOS NEXT</text>

  <!-- e-cat -->
  <text x="120" y="276" class="t-mono-branch">├─ </text><text x="144" y="276" class="t-mono">e-cat/</text>
  <text x="430" y="276" class="t-cmt"># Framework mikroservis Rust · 51 crates</text>
  <text x="190" y="306" class="t-mono-branch">│  ├─ </text><text x="230" y="306" class="t-mono">ecat-transport-http/</text>
  <text x="480" y="306" class="t-cmt"># Lapisan transport HTTP axum</text>
  <text x="190" y="336" class="t-mono-branch">│  ├─ </text><text x="230" y="336" class="t-mono">ecat-transport-grpc/</text>
  <text x="480" y="336" class="t-cmt"># Lapisan transport gRPC tonic</text>
  <text x="190" y="366" class="t-mono-branch">│  ├─ </text><text x="230" y="366" class="t-mono">ecat-data-sqlx/</text>
  <text x="480" y="366" class="t-cmt"># Akses data MySQL (SQLx)</text>
  <text x="190" y="396" class="t-mono-branch">│  ├─ </text><text x="230" y="396" class="t-mono">ecat-data-redis/</text>
  <text x="480" y="396" class="t-cmt"># Klien cache Redis</text>
  <text x="190" y="426" class="t-mono-branch">│  ├─ </text><text x="230" y="426" class="t-mono">ecat-data-opensearch/</text>
  <text x="480" y="426" class="t-cmt"># Pencarian multibahasa OpenSearch</text>
  <text x="190" y="456" class="t-mono-branch">│  ├─ </text><text x="230" y="456" class="t-mono">ecat-security/</text>
  <text x="480" y="456" class="t-cmt"># Keamanan · Filter input</text>
  <text x="190" y="486" class="t-mono-branch">│  ├─ </text><text x="230" y="486" class="t-mono">ecat-auth/</text>
  <text x="480" y="486" class="t-cmt"># Autentikasi JWT · OAuth2</text>
  <text x="190" y="516" class="t-mono-branch">│  └─ </text><text x="230" y="516" class="t-mono">ecat-cli/</text>
  <text x="480" y="516" class="t-cmt"># Alat baris perintah</text>

  <!-- 其余 -->
  <text x="230" y="546" class="t-mono-branch">… </text><text x="268" y="546" class="t-cmt">(43 crates lainnya dihilangkan)</text>

  <!-- docs / config / README -->
  <text x="120" y="576" class="t-mono-branch">├─ </text><text x="144" y="576" class="t-mono">docs/</text>
  <text x="430" y="576" class="t-cmt"># Dokumen teknis</text>
  <text x="190" y="606" class="t-mono-branch">│  ├─ </text><text x="230" y="606" class="t-mono">i18n/</text>
  <text x="480" y="606" class="t-cmt"># Dokumen 12 bahasa</text>
  <text x="190" y="636" class="t-mono-branch">│  └─ </text><text x="230" y="636" class="t-mono">svg/</text>
  <text x="480" y="636" class="t-cmt"># Diagram arsitektur · 12 bahasa</text>
  <text x="120" y="666" class="t-mono-branch">├─ </text><text x="144" y="666" class="t-mono">config/</text>
  <text x="430" y="666" class="t-cmt"># File konfigurasi</text>
  <text x="120" y="696" class="t-mono-branch">├─ </text><text x="144" y="696" class="t-mono">scripts/</text>
  <text x="430" y="696" class="t-cmt"># Skrip deploy &amp; operasional</text>
  <text x="190" y="726" class="t-mono-branch">│  └─ </text><text x="230" y="726" class="t-mono">cdn/</text>
  <text x="480" y="726" class="t-cmt"># 8 plugin CDN (AWS/Aliyun/GCP/Azure/Cloudflare/Tencent/Huawei/Bunny)</text>
  <text x="120" y="756" class="t-mono-branch">└─ </text><text x="144" y="756" class="t-mono">README.md</text>
  <text x="430" y="756" class="t-cmt"># Deskripsi proyek</text>

  <!-- 数据库标注 -->
  <rect x="40" y="796" width="920" height="68" class="panel"/>
  <text x="64" y="696" class="t-h">Database — travel</text>
  <text x="64" y="720" class="t-db">Prefiks tabel travel_: travel_users · travel_orders · travel_reviews · travel_destinations · travel_attractions</text>
  <text x="988" y="872" text-anchor="end" font-size="12" fill="#8b949e" fill-opacity="0.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">https://erik.xyz</text>
</svg>
