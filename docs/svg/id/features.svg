  <text x="595" y="378" text-anchor="middle" class="t-s">Sumber Daya 12+ Bahasa</text>
  <text x="595" y="400" text-anchor="middle" class="t-s">Format ARB · Muat Dinamis</text>

  <rect x="715" y="280" width="210" height="150" class="card"/>
  <rect x="715" y="280" width="210" height="4" class="accent"/>
  <text x="820" y="322" text-anchor="middle" class="t-m">Notifikasi Kafka</text>
