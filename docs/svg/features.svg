  <text x="595" y="400" text-anchor="middle" class="t-s">ARB 格式 · 动态加载</text>

  <rect x="715" y="280" width="210" height="150" class="card"/>
  <rect x="715" y="280" width="210" height="4" class="accent"/>
  <text x="820" y="322" text-anchor="middle" class="t-m">Kafka 通知</text>
