@keyframes ex-knockline { 0%,100% { transform: scaleX(.6); opacity: .35; } 35% { transform: scaleX(1); opacity: 1; } }
@keyframes ex-palm { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2.4px) rotate(-4deg); } }
@keyframes ex-steam { 0% { transform: translateY(0); opacity: .7; } 100% { transform: translateY(-18px); opacity: 0; } }
@keyframes ex-shock { 0%,100% { transform: scaleX(.7); opacity: .4; } 50% { transform: scaleX(1.25); opacity: 1; } }
@keyframes ex-please { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.6px); } }
@keyframes ex-drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) {
  .ex-motion, [class*="ex-anim-"] { animation: none !important; }
}
