[package]
name = "ecat"
version.workspace = true
edition.workspace = true
description = "Aggregate crate: batteries-included entry point for e-cat"
license.workspace = true

[features]
default = ["http", "grpc", "middleware", "auth", "circuit-breaker", "tracing", "redis"]
http = ["dep:ecat-transport-http"]
grpc = ["dep:ecat-transport-grpc"]
middleware = ["dep:ecat-middleware"]
auth = ["dep:ecat-auth"]
client = ["dep:ecat-client"]
events = ["dep:ecat-events"]
metrics = ["dep:ecat-metrics"]
tracing = ["dep:ecat-tracing"]
circuit-breaker = ["dep:ecat-circuit-breaker"]
consul = ["dep:ecat-registry-consul"]
remote = ["dep:ecat-config-remote"]
redis = ["dep:ecat-data-redis"]

[dependencies]
ecat-transport = { workspace = true }
ecat-logging = { workspace = true }
ecat-errors = { workspace = true }
ecat-transport-http = { workspace = true, optional = true }
ecat-transport-grpc = { workspace = true, optional = true }
ecat-middleware = { workspace = true, optional = true }
ecat-auth = { workspace = true, optional = true }
ecat-client = { workspace = true, optional = true }
ecat-events = { workspace = true, optional = true }
ecat-metrics = { workspace = true, optional = true }
ecat-tracing = { workspace = true, optional = true }
ecat-circuit-breaker = { workspace = true, optional = true }
ecat-registry-consul = { workspace = true, optional = true }
ecat-config-remote = { workspace = true, optional = true }
ecat-data-redis = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "macros", "signal", "rt-multi-thread", "time"] }
tracing.workspace = true
async-trait.workspace = true

axum.workspace = true
tower.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
bcrypt = "0.15"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2.workspace = true
ecat-security = { path = "../ecat-security" }
ecat-data = { path = "../ecat-data" }
ecat-data-sqlx = { path = "../ecat-data-sqlx" }
ecat-data-opensearch = { path = "../ecat-data-opensearch" }
ecat-mq = { path = "../ecat-mq" }
ecat-mq-kafka = { path = "../ecat-mq-kafka" }
idgen_rs = "0.2.0"
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

# open-travel 业务服务入口（业务代码在 src/business/，入口仅是薄壳）
[[bin]]
name = "user-service"
path = "src/bin/user-service.rs"

[[bin]]
name = "booking-service"
path = "src/bin/booking-service.rs"

[[bin]]
name = "admin-service"
path = "src/bin/admin-service.rs"

[[bin]]
name = "search-service"
path = "src/bin/search-service.rs"

[[bin]]
name = "line-service"
path = "src/bin/line-service.rs"

[[bin]]
name = "order-service"
path = "src/bin/order-service.rs"

[[bin]]
name = "flight-service"
path = "src/bin/flight-service.rs"

[[bin]]
name = "hotel-service"
path = "src/bin/hotel-service.rs"

[[bin]]
name = "payment-service"
path = "src/bin/payment-service.rs"
