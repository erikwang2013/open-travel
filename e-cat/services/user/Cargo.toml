[package]
name = "user-service"
version = "0.1.0"
edition = "2024"
description = "open-travel user service (profile / register)"

[dependencies]
shared = { path = "../shared" }
# e-cat 聚合 crate 只取核心（App 生命周期），不启用 grpc 以缩小依赖树
ecat = { path = "../../ecat", default-features = false }
ecat-transport-http = { path = "../../ecat-transport-http" }
ecat-auth = { path = "../../ecat-auth" }
ecat-middleware = { path = "../../ecat-middleware" }
ecat-security = { path = "../../ecat-security" }
ecat-circuit-breaker = { path = "../../ecat-circuit-breaker" }
ecat-tracing = { path = "../../ecat-tracing" }
ecat-data = { path = "../../ecat-data" }
ecat-data-sqlx = { path = "../../ecat-data-sqlx" }
ecat-data-redis = { path = "../../ecat-data-redis" }
ecat-mq-kafka = { path = "../../ecat-mq-kafka" }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
bcrypt = "0.15"
