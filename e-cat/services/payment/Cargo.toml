[package]
name = "payment-service"
version = "0.1.0"
edition = "2024"
description = "open-travel payment service (Phase 4)"

[dependencies]
shared = { path = "../shared" }
ecat = { path = "../../ecat", default-features = false }
ecat-auth = { path = "../../ecat-auth" }
ecat-transport-http = { path = "../../ecat-transport-http" }
ecat-middleware = { path = "../../ecat-middleware" }
ecat-security = { path = "../../ecat-security" }
ecat-circuit-breaker = { path = "../../ecat-circuit-breaker" }
ecat-tracing = { path = "../../ecat-tracing" }
ecat-data = { path = "../../ecat-data" }
ecat-data-sqlx = { path = "../../ecat-data-sqlx" }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
# 渠道回调验签（HMAC-SHA256，开发模拟）
hmac = "0.12"
sha2.workspace = true
# 调 order-service 确认支付（容器内 http://ecat-order:8006，纯 http 无需 TLS）
reqwest = { version = "0.12", default-features = false, features = ["json"] }
