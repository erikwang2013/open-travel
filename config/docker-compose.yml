# open-travel 本地开发环境编排
# 启动：docker compose --env-file .env -f config/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: unless-stopped
    # 主库：开启 binlog（server-id=1，ROW 格式）供从库复制；
    # 忽略客户端声明的字符集，强制使用服务器 utf8mb4（修复 sqlx 连接中文乱码）
    command: --server-id=1 --log-bin --binlog-format=ROW --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travel_dev}
      MYSQL_DATABASE: travel
    volumes:
      # 首次初始化自动执行 schema.sql（仅空数据卷时生效）
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - travel-mysql-data:/var/lib/mysql
    ports:
      # host 3306 被宿主 mysql 占用，临时映射 3308（见 docs/integration-report.md）
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-travel_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MySQL 从库：只读副本（读写分离，应用层按连接池路由）。
  # 首次启动（空数据卷）由 replica-init.sh dump 主库现有数据并启动复制；
  # server-id 必须与主库不同。
  mysql-replica:
    image: mysql:8.0
    container_name: travel-mysql-replica
    restart: unless-stopped
    command: --server-id=2 --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travel_dev}
    volumes:
      - ./replica-init.sh:/docker-entrypoint-initdb.d/replica-init.sh:ro
      - travel-mysql-replica-data:/var/lib/mysql
    ports:
      - "3309:3306"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-travel_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Kafka 单节点（KRaft 模式，无 Zookeeper）：审计日志 topic（travel-audit）
  # 由首次发布自动创建。ADVERTISED 指向服务名 kafka，容器内服务与
  # docker exec 内验证均可直连；宿主侧消费请经容器 IP 或 exec 进容器。
  kafka:
    image: apache/kafka:3.9.0
    container_name: travel-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: open-travel-dev
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: travel-redis
    restart: unless-stopped
    # 会话存储 TTL 30 分钟、热门内容缓存 TTL 5 分钟（TTL 由应用写入时指定）
    ports:
      # host 6379 被宿主 redis 占用，临时映射 6381
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: travel-opensearch
    restart: unless-stopped
    environment:
      # 单节点开发模式：关闭安全插件，无需自签证书
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ./opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ports:
      # host 9200 被 open-novel-opensearch 占用，临时映射 9201
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # e-cat (Rust) 业务服务（Phase 1：user/booking 两个二进制，共用一个镜像）
  # 健康检查 /health、/ready；网关路由留 Phase 1 末/Phase 2 统一
  ecat-user:
    build:
      context: ..
      dockerfile: e-cat/services/Dockerfile
    command: ["user-service"]
    container_name: travel-ecat-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql:3306/travel?charset=utf8mb4
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-bytes-minimum-secret}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8001:8001"

  # 网关：统一入口 8080，按 /api/v1/{user|booking} 前缀分流（config/nginx.conf）
  nginx:
    image: nginx:alpine
    container_name: travel-nginx
    restart: unless-stopped
    depends_on:
      - ecat-user
      - ecat-booking
      - ecat-admin
      - ecat-search
      - ecat-line
      - ecat-order
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # host 8080 被宿主 tracking-gateway、8081 被 bag/remus http.server 占用，临时映射 8082
      - "8082:80"

  ecat-booking:
    build:
      context: ..
      dockerfile: e-cat/services/Dockerfile
    command: ["booking-service"]
    container_name: travel-ecat-booking
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql:3306/travel?charset=utf8mb4
      # 从库连接（读写分离只读路径；缺省时服务降级为仅主库）
      REPLICA_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql-replica:3306/travel?charset=utf8mb4
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-bytes-minimum-secret}
    ports:
      - "8002:8002"

  # 管理端服务（P2-06 admin-service：登录 + CRUD）
  ecat-admin:
    build:
      context: ..
      dockerfile: e-cat/services/Dockerfile
    command: ["admin-service"]
    container_name: travel-ecat-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql:3306/travel?charset=utf8mb4
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-bytes-minimum-secret}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8003:8003"

  # Phase 3：搜索服务（P3-01/02 检索 + 热词；OpenSearch 内容同步）
  ecat-search:
    build:
      context: ..
      dockerfile: e-cat/services/Dockerfile
    command: ["search-service"]
    container_name: travel-ecat-search
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql:3306/travel?charset=utf8mb4
      REPLICA_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql-replica:3306/travel?charset=utf8mb4
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-bytes-minimum-secret}
    ports:
      - "8004:8004"

  # Phase 3：线路服务（P3-05/06 线路列表/详情/出发日历余位）
  ecat-line:
    build:
      context: ..
      dockerfile: e-cat/services/Dockerfile
    command: ["line-service"]
    container_name: travel-ecat-line
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql:3306/travel?charset=utf8mb4
      REPLICA_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql-replica:3306/travel?charset=utf8mb4
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-bytes-minimum-secret}
    ports:
      - "8005:8005"

  # Phase 3：订单服务（P3-08/09 下单/预占/状态机/取消）
  ecat-order:
    build:
      context: ..
      dockerfile: e-cat/services/Dockerfile
    command: ["order-service"]
    container_name: travel-ecat-order
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-travel_dev}@mysql:3306/travel?charset=utf8mb4
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32-bytes-minimum-secret}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8006:8006"

volumes:
  travel-mysql-data:
  travel-mysql-replica-data:
