# open-travel 网关：统一入口 /api/{user|booking|admin|search|lines|orders}，按服务前缀分流
# API 版本经 X-Api-Version header 传递（v1），URL 不含版本前缀，由服务端校验
# 容器名即服务名（docker compose 内部 DNS）；host 端口 8080 → 容器 80
# ponytail: 未加 nginx limit_req（服务端已有 Redis 分布式限流），
# 若需网关层限速再加 limit_req_zone
events {}

http {
    upstream user_upstream { server ecat-user:8001; }
    upstream booking_upstream { server ecat-booking:8002; }
    upstream admin_upstream { server ecat-admin:8003; }
    upstream search_upstream { server ecat-search:8004; }
    upstream line_upstream { server ecat-line:8005; }
    upstream order_upstream { server ecat-order:8006; }

    server {
        listen 80;

        # 管理端 Flutter Web 跨域（CORS）：全站放行，OPTIONS 预检直接 204
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Api-Version, Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        # 网关健康检查代理到 user 服务（canary）
        location /health { proxy_pass http://user_upstream/health; }
        location /ready  { proxy_pass http://user_upstream/ready; }

        # 按前缀分流，保留原始 URI
        location /api/user/    { proxy_pass http://user_upstream; }
        location /api/booking/ { proxy_pass http://booking_upstream; }
        location /api/admin/  { proxy_pass http://admin_upstream; }
        # 无尾斜杠：客户端以 /api/search 等路径名本身发起请求（如列表页），
        # 带斜杠的前缀 location 会对「恰好等于前缀」的路径 301 加斜杠
        location /api/search { proxy_pass http://search_upstream; }
        location /api/lines  { proxy_pass http://line_upstream; }
        location /api/orders { proxy_pass http://order_upstream; }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
