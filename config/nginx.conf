# open-travel 网关：统一入口 /api/{user|booking|admin|search|lines|orders}，按服务前缀分流
# API 版本经 X-Api-Version header 传递（v1），URL 不含版本前缀，由服务端校验
# 容器名即服务名（docker compose 内部 DNS）；host 端口 8082 → 容器 80（本地），8443 → 443（TLS）
# TLS：证书占位路径 /etc/nginx/certs/（容器内），宿主侧文件在 config/certs/，
# 放置/替换真实证书见 config/certs/README.md；本地 80 保持 http 不受影响
# ponytail: 未加 nginx limit_req（服务端已有 Redis 分布式限流），
# 若需网关层限速再加 limit_req_zone
events {}

http {
    server_tokens off;

    upstream user_upstream { server ecat-user:8001; }
    upstream booking_upstream { server ecat-booking:8002; }
    upstream admin_upstream { server ecat-admin:8003; }
    upstream search_upstream { server ecat-search:8004; }
    upstream line_upstream { server ecat-line:8005; }
    upstream order_upstream { server ecat-order:8006; }
    upstream flight_upstream { server ecat-flight:8007; }
    upstream hotel_upstream { server ecat-hotel:8008; }
    upstream payment_upstream { server ecat-payment:8009; }

    # 本地开发主机（localhost/私网 IP）访问 80 时不跳转 https；其余主机一律 301 到 https
    map $host $is_local {
        default 0;
        localhost 1;
        127.0.0.1 1;
        ~^192\.168\. 1;
        ~^10\. 1;
        ~^172\.(1[6-9]|2[0-9]|3[01])\. 1;
    }

    server {
        listen 80;
        # 非本地主机强制 HTTPS（server 级 if-return 优先于 location）
        if ($is_local = 0) { return 301 https://$host$request_uri; }

        # 管理端 Flutter Web 跨域（CORS）：全站放行，OPTIONS 预检直接 204
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Api-Version, Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        # 网关健康检查代理到 user 服务（canary）
        location /health { proxy_pass http://user_upstream/health; }
        location /ready  { proxy_pass http://user_upstream/ready; }

        # 按前缀分流，保留原始 URI
        location /api/user/    { proxy_pass http://user_upstream; }
        location /api/booking/ { proxy_pass http://booking_upstream; }
        location /api/admin/  { proxy_pass http://admin_upstream; }
        # 无尾斜杠：客户端以 /api/search 等路径名本身发起请求（如列表页），
        # 带斜杠的前缀 location 会对「恰好等于前缀」的路径 301 加斜杠
        location /api/search { proxy_pass http://search_upstream; }
        location /api/lines  { proxy_pass http://line_upstream; }
        location /api/orders { proxy_pass http://order_upstream; }
        location /api/flights { proxy_pass http://flight_upstream; }
        location /api/hotels  { proxy_pass http://hotel_upstream; }
        location /api/payments { proxy_pass http://payment_upstream; }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTTPS 入口（生产）：证书占位 config/certs/，替换后 nginx reload 生效
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS（与 80 一致）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Api-Version, Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        location /health { proxy_pass http://user_upstream/health; }
        location /ready  { proxy_pass http://user_upstream/ready; }

        location /api/user/    { proxy_pass http://user_upstream; }
        location /api/booking/ { proxy_pass http://booking_upstream; }
        location /api/admin/  { proxy_pass http://admin_upstream; }
        location /api/search { proxy_pass http://search_upstream; }
        location /api/lines  { proxy_pass http://line_upstream; }
        location /api/orders { proxy_pass http://order_upstream; }
        location /api/flights { proxy_pass http://flight_upstream; }
        location /api/hotels  { proxy_pass http://hotel_upstream; }
        location /api/payments { proxy_pass http://payment_upstream; }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
