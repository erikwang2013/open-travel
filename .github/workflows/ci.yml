name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-cat
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ecat-protos 的 build.rs 需要 protoc；GitHub runner 默认未安装
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo check -p ecat --all-targets
      - run: cargo test -p ecat --tests

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Client analyze
        working-directory: apps/client/flutter
        run: flutter analyze
      - name: Client test
        working-directory: apps/client/flutter
        run: flutter test
      - name: Admin test
        working-directory: apps/admin
        run: flutter test
